name: Verify

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  android-and-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle
      - name: Verify repository structure
        run: python3 scripts/verify_repository.py
      - name: Build conventions and run host tests
        run: ./gradlew :plugins:convention:build testAndroidHostTest :androidApp:assembleDevDebug --no-daemon

  ios-framework:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle
      - name: Link simulator framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon
